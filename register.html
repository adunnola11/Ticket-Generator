<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TechSummit 2026</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

    <header>
    <nav class="navbar" aria-label="Main navigation">

        <a href="index.html#home" class="logo">
            TechSummit<span>2026</span>
        </a>

        <button class="menu-toggle"
                id="menuToggle"
                aria-label="Open navigation menu"
                aria-expanded="false"
                aria-controls="navLinks">
            ☰
        </button>

        <ul class="nav-links" id="navLinks">
            <li><a href="index.html#home">Home</a></li>
            <li><a href="index.html#about">About</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>

    </nav>
</header>



    <!-- Registration Section -->
    <section class="registration" id="register">
        <div class="section-heading">
            <p class="event-label">REGISTRATION</p>
            <h2>Get Your Conference Ticket</h2>
            <p>Fill in your details to generate your ticket.</p>
        </div>

        <form id="ticketForm" novalidate>

            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName"
                       name="fullName"
                       autocomplete="name"
                       placeholder="Enter your full name"
                       required>
                <small id="nameError" class="error"
                       aria-live="polite"></small>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email"
                       name="email"
                       autocomplete="email"
                       placeholder="example@email.com"
                       required>
                <small id="emailError" class="error"
                       aria-live="polite"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone"
                       name="phone"
                       autocomplete="tel"
                       placeholder="Enter phone number"
                       required>
                <small id="phoneError" class="error"
                       aria-live="polite"></small>
            </div>

            <div class="form-group">
                <label for="ticketType">Ticket Type *</label>
                <select id="ticketType" name="ticketType" required>
                    <option value="">Select ticket type</option>
                    <option value="Regular">Regular - ₦5,000</option>
                    <option value="VIP">VIP - ₦10,000</option>
                    <option value="VVIP">VVIP - ₦20,000</option>
                </select>
                <small id="ticketError" class="error"
                       aria-live="polite"></small>
            </div>

            <div class="form-group">
                <label for="avatar">Upload Avatar (Optional)</label>
                <p class="hint" id="avatarHint">
                    PNG, JPG or WEBP. Maximum file size: 2MB.
                </p>
                <input type="file" id="avatar"
                       name="avatar"
                       accept="image/png,image/jpeg,image/webp"
                       aria-describedby="avatarHint avatarError">
                <small id="avatarError" class="error"
                       aria-live="polite"></small>
                <img id="avatarPreview"
                     class="avatar-preview"
                     alt="Preview of your uploaded avatar"
                     hidden>
            </div>

            <button type="submit" class="submit-btn">
                Generate My Ticket
            </button>

            <p id="formMessage" role="status"
               aria-live="polite"></p>
        </form>
    </section>

        <script src="script.js"></script>
</body>
</html>
